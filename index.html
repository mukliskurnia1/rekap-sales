<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Data Cabang</title>
    <!-- Memanggil CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-pills .nav-link { color: #555; font-weight: bold; border-radius: 8px; margin: 0 5px; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
        .form-label { font-weight: 600; color: #444; }
        .area-box { background-color: #e9ecef; border: 1px solid #dee2e6; border-radius: 10px; padding: 20px; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary mb-1">Portal Input Data</h3>
                <p class="text-muted small">Sistem Rekapitulasi Sales & Evaluasi Training</p>
            </div>
            
            <div class="card card-custom p-4 bg-white">
                
                <!-- ==============================================
                     KOTAK PILIH LOKASI (REGIONAL & CABANG)
                =============================================== -->
                <div class="area-box mb-4 shadow-sm">
                    <h6 class="fw-bold text-secondary mb-3">📍 Tentukan Lokasi Anda:</h6>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label small">Regional</label>
                            <select class="form-select border-primary" id="global_regional" onchange="updateCabang()" required>
                                <option value="">-- Memuat Data... --</option>
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small">Cabang</label>
                            <select class="form-select border-primary" id="global_cabang" required>
                                <option value="">-- Pilih Regional Dulu --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- ==============================================
                     NAVIGASI TAB SALES & FEEDBACK
                =============================================== -->
                <ul class="nav nav-pills mb-4 nav-justified" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-sales" type="button">📊 Form Sales</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-feedback" type="button">📝 Form Feedback</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- ==============================================
                         FORM SALES
                    =============================================== -->
                    <div class="tab-pane fade show active" id="tab-sales">
                        <form id="salesForm" onsubmit="submitSales(event)">
                            <div class="mb-3">
                                <label class="form-label">Tanggal Transaksi</label>
                                <input type="date" id="s_tanggal" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Item Penjualan</label>
                                <select id="s_kode_item" class="form-select" required>
                                    <option value="">-- Memuat item... --</option>
                                </select>
                            </div>
                            <div class="row mb-4 g-3">
                                <div class="col-6">
                                    <label class="form-label">Jenis Harga</label>
                                    <select id="s_jenis" class="form-select" required>
                                        <option value="Reguler">Reguler</option>
                                        <option value="Promo">Promo</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Jumlah (Qty)</label>
                                    <input type="number" id="s_qty" class="form-control" placeholder="Contoh: 5" min="1" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Kirim Data Sales</button>
                        </form>
                    </div>

                    <!-- ==============================================
                         FORM FEEDBACK EVALUASI
                    =============================================== -->
                    <div class="tab-pane fade" id="tab-feedback">
                        <form id="feedbackForm" onsubmit="submitFeedback(event)">
                            <div class="mb-3">
                                <label class="form-label">Tanggal Pelaksanaan Training</label>
                                <input type="date" id="f_tanggal" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Nama Peserta (Opsional)</label>
                                <input type="text" id="f_nama" class="form-control" placeholder="Boleh dikosongkan (Anonim)">
                            </div>
                            
                            <hr class="text-muted">
                            <h6 class="fw-bold mb-3 text-secondary">Kuesioner Evaluasi:</h6>
                            
                            <!-- Tempat Pertanyaan Dinamis Muncul -->
                            <div id="dynamic-questions">
                                <p class="text-muted small">Memuat pertanyaan...</p>
                            </div>
                            
                            <hr class="text-muted mb-4">
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm">Kirim Feedback</button>
                        </form>
                    </div>
                </div>

            </div> <!-- End Card -->
        </div>
    </div>
</div>

<!-- Memanggil Javascript Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://api-sales.kkgs.web.id';
    let dataArea = [];

    // ==========================================
    // 1. MEMUAT DATA LOKASI (REGIONAL & CABANG)
    // ==========================================
    fetch(`${API_URL}/api/area`)
        .then(res => res.json())
        .then(data => {
            dataArea = data;
            // Mengambil daftar regional yang unik (tidak dobel)
            const regionals = [...new Set(data.map(item => item.regional))];
            
            let htmlReg = '<option value="">-- Pilih Regional --</option>';
            regionals.forEach(r => htmlReg += `<option value="${r}">${r}</option>`);
            document.getElementById('global_regional').innerHTML = htmlReg;
        })
        .catch(err => document.getElementById('global_regional').innerHTML = '<option value="">Gagal memuat data</option>');

    // Fungsi otomatis saat dropdown Regional dipilih
    function updateCabang() {
        const regPilih = document.getElementById('global_regional').value;
        const cabangFiltered = dataArea.filter(item => item.regional === regPilih);
        
        let htmlCab = '<option value="">-- Pilih Cabang --</option>';
        cabangFiltered.forEach(c => htmlCab += `<option value="${c.cabang}">${c.cabang}</option>`);
        document.getElementById('global_cabang').innerHTML = htmlCab;
    }

    // ==========================================
    // 2. MEMUAT DATA ITEM SALES
    // ==========================================
    fetch(`${API_URL}/api/items`)
        .then(res => res.json())
        .then(data => {
            let html = '<option value="">-- Pilih Item Penjualan --</option>';
            data.forEach(x => html += `<option value="${x.kode_item}">${x.kode_item} - ${x.nama_item}</option>`);
            document.getElementById('s_kode_item').innerHTML = html;
        });

    // ==========================================
    // 3. MEMUAT PERTANYAAN FEEDBACK DINAMIS
    // ==========================================
    fetch(`${API_URL}/api/pertanyaan`)
        .then(res => res.json())
        .then(data => {
            let html = '';
            data.forEach((q, index) => {
                html += `<div class="mb-3"><label class="form-label">${index + 1}. ${q.pertanyaan}</label>`;
                
                // Menentukan jenis form (Dropdown Pilihan, Tanggal, atau Teks Biasa)
                if (q.tipe_jawaban === 'Pilihan') {
                    const opsi = q.pilihan_jawaban.split(','); // Memecah koma menjadi array
                    html += `<select class="form-select d-jawaban" data-id="${q.id}" required><option value="">-- Pilih --</option>`;
                    opsi.forEach(o => html += `<option value="${o.trim()}">${o.trim()}</option>`);
                    html += `</select>`;
                } else if (q.tipe_jawaban === 'Tanggal') {
                    html += `<input type="date" class="form-control d-jawaban" data-id="${q.id}" required>`;
                } else {
                    html += `<input type="text" class="form-control d-jawaban" data-id="${q.id}" placeholder="Tulis jawaban..." required>`;
                }
                
                html += `</div>`;
            });
            document.getElementById('dynamic-questions').innerHTML = html;
        });

    // ==========================================
    // 4. FUNGSI VALIDASI & KIRIM DATA
    // ==========================================
    
    // Fungsi pembantu untuk memastikan Regional & Cabang sudah diisi
    function cekArea() {
        const reg = document.getElementById('global_regional').value;
        const cab = document.getElementById('global_cabang').value;
        if (!reg || !cab) { 
            alert('PENTING: Silakan pilih Regional dan Cabang terlebih dahulu di kotak bagian atas!'); 
            return false; 
        }
        return { regional: reg, cabang: cab };
    }

    // Kirim Sales
    function submitSales(e) {
        e.preventDefault();
        const area = cekArea(); 
        if (!area) return;

        const dataSales = {
            tanggal: document.getElementById('s_tanggal').value,
            regional: area.regional,
            cabang: area.cabang,
            kode_item: document.getElementById('s_kode_item').value,
            jenis_harga: document.getElementById('s_jenis').value,
            qty: document.getElementById('s_qty').value
        };

        fetch(`${API_URL}/api/input-sales`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataSales)
        })
        .then(res => res.json())
        .then(res => {
            alert(res.message);
            if (res.status === 'sukses') e.target.reset(); // Mengosongkan form sales (tapi pilihan lokasi tetap aman)
        })
        .catch(err => alert('Terjadi kesalahan saat mengirim data.'));
    }

    // Kirim Feedback
    function submitFeedback(e) {
        e.preventDefault();
        const area = cekArea(); 
        if (!area) return;

        // Mengumpulkan semua jawaban dari form dinamis
        let arrayJawaban = [];
        document.querySelectorAll('.d-jawaban').forEach(el => {
            arrayJawaban.push({ 
                pertanyaan_id: el.getAttribute('data-id'), 
                isi_jawaban: el.value 
            });
        });

        const dataFeedback = {
            tanggal_pelaksanaan: document.getElementById('f_tanggal').value,
            regional: area.regional,
            cabang: area.cabang,
            nama_peserta: document.getElementById('f_nama').value || 'Anonim',
            jawaban: arrayJawaban
        };

        fetch(`${API_URL}/api/input-feedback`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataFeedback)
        })
        .then(res => res.json())
        .then(res => {
            alert(res.message);
            if (res.status === 'sukses') e.target.reset(); // Mengosongkan form feedback
        })
        .catch(err => alert('Terjadi kesalahan saat mengirim data.'));
    }
</script>
</body>
</html>
